name: macOS Build

on:
  push:
    branches: [main]
    paths:
      - "macOS/**"
      - ".github/workflows/macos-build.yml"
  workflow_dispatch: {}

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build, sign, notarize
    runs-on: macos-15
    defaults:
      run:
        working-directory: macOS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Invasiones/Invasiones.xcodeproj \
            -scheme Invasiones \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Invasiones.xcarchive" \
            -destination "generic/platform=macOS" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM=44DMMFA3SQ

      - name: Export signed app
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Invasiones.xcarchive" \
            -exportOptionsPlist ci/exportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"

      - name: Create DMG
        run: |
          set -euo pipefail
          hdiutil create -volname "Invasiones" \
            -srcfolder "$RUNNER_TEMP/export/Invasiones.app" \
            -ov -format UDZO \
            "$RUNNER_TEMP/Invasiones.dmg"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool submit "$RUNNER_TEMP/Invasiones.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id 44DMMFA3SQ \
            --wait
          xcrun stapler staple "$RUNNER_TEMP/Invasiones.dmg"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Invasiones-macOS
          path: ${{ runner.temp }}/Invasiones.dmg
          retention-days: 30

      - name: Publish rolling "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-macos-build
          name: "Invasiones (latest macOS build)"
          body: |
            Automatically built and notarized from the latest commit on `main`
            (${{ github.sha }}). Download `Invasiones.dmg` below.
          prerelease: true
          files: ${{ runner.temp }}/Invasiones.dmg
